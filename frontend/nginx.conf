# One origin for the browser: the SPA and /api are served together, so no CORS is needed
# and the refresh cookie (SameSite=Strict, Path=/api/v1/auth) works as in development.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are limited to 10 MB by the backend; leave room for multipart overhead.
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/documents/..., /labs/...) all load the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
