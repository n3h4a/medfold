# Keep "https" when Caddy terminated TLS in front of nginx (production); otherwise use our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# One origin for the browser: the SPA and /api are served together, so no CORS is needed
# and the refresh cookie (SameSite=Strict, Path=/api/v1/auth) works as in development.
server {
    listen 80;
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are limited to 10 MB by the backend; leave room for multipart overhead.
    client_max_body_size 11m;

    # Scripts, styles and API calls only from this origin; uploaded files are shown from blob: URLs
    # (PDF in a frame, images inline); nothing may frame the app except itself.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached forever.
    # A location with its own add_header doesn't inherit the server's, so the security headers repeat.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes (/documents/..., /labs/...) all load the SPA.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
