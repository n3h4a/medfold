# Reads the repo-root .env when running from backend/ (e.g. ./mvnw spring-boot:run).
# Real environment variables always take precedence. Tests point MEDFOLD_ENV_FILE elsewhere
# (see pom.xml) so a developer's local .env can never change test behaviour.
spring:
  application:
    name: medfold-backend
  config:
    import: optional:file:${MEDFOLD_ENV_FILE:../.env}[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medfold}
    username: ${POSTGRES_USER:medfold}
    password: ${POSTGRES_PASSWORD:change_me}
  servlet:
    multipart:
      max-file-size: 10MB
      # A little above the file limit to leave room for multipart headers.
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}
  tomcat:
    # Read (and discard) oversized uploads up to this size so the client gets a clean 413
    # instead of a connection reset.
    max-swallow-size: 50MB

medfold:
  jwt:
    # HMAC-SHA256 signing key, at least 32 characters. Generate with: openssl rand -hex 32
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    issuer: medfold
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:P7D}
    cookie-name: medfold_refresh
    # Must be true in production (HTTPS). Set false only for plain-HTTP local development.
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}

  processing:
    # Background worker that sends uploads to the AI service. Off until the AI client is connected.
    enabled: ${MEDFOLD_PROCESSING_ENABLED:false}
    poll-interval: PT2S
    batch-size: 3
    max-attempts: 3
    retry-delay: PT30S
    stale-after: PT10M

  storage:
    # Local folder for uploaded files (relative to backend/). Swapped for object storage in production.
    root: ${STORAGE_ROOT:../data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
