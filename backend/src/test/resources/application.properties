# Test-only signing key; never used outside tests.
medfold.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789
medfold.storage.root=target/test-uploads
# Tests run the worker explicitly (JobRunner.runDue) instead of on a schedule.
medfold.processing.enabled=false
# Every MockMvc request comes from 127.0.0.1; only LoginThrottleTest checks the address limit.
medfold.login-throttle.max-failures-per-address=100000
