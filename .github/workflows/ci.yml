name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers starts PostgreSQL in the runner's Docker. JaCoCo writes the coverage report.
      - run: ./mvnw -B test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml
      # Real OCR tests need Tesseract; without it they are skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term --cov-report=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-service-coverage
          path: ai-service/htmlcov/

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
      # Type-checks (tsc -b) and builds the production bundle.
      - run: npm run build

  deployment-config:
    name: Deployment config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # The production overlay must stay valid too (it refuses to start without real values).
      - run: docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml config --quiet
        env:
          MEDFOLD_DOMAIN: ci.example.com
          POSTGRES_PASSWORD: ci-only
          JWT_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only
          AI_INTERNAL_KEY: ci-only
      - run: bash -n scripts/backup.sh scripts/restore.sh

  e2e:
    name: End-to-end (Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start the full stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -sf http://localhost:3000/api/v1/health | grep -q '"aiService":"UP"' && exit 0
            sleep 2
          done
          docker compose logs --tail 100
          exit 1
      # Synthetic reports through nginx → backend → AI service, including a photographed
      # prescription read by Tesseract. Fails if any document isn't processed.
      - name: Seed demo data
        run: API_URL=http://localhost:3000/api/v1 WITH_PHOTO=1 scripts/seed-demo-data.sh
      - name: Run the Postman collection
        run: npx -y newman@6 run postman/medfold.postman_collection.json -e postman/medfold.docker.postman_environment.json --working-dir .
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

