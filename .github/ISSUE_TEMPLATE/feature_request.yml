name: Feature idea
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Alternatives you considered, examples, links. Note that Medfold describes documents and never gives medical advice.
