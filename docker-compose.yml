name: medfold

services:
  db:
    image: postgres:16-alpine
    container_name: medfold-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medfold_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: medfold-ai
    restart: unless-stopped
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  backend:
    build: ./backend
    container_name: medfold-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-P7D}
      # Set to true when the app is served over HTTPS.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      MEDFOLD_PROCESSING_ENABLED: ${MEDFOLD_PROCESSING_ENABLED:-true}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
    volumes:
      - medfold_uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: medfold-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  medfold_pgdata:
  medfold_uploads:
