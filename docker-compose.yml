name: medfold

services:
  db:
    image: postgres:16-alpine
    container_name: medfold-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medfold_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build: ./ai-service
    container_name: medfold-ai
    restart: unless-stopped
    environment:
      AI_INTERNAL_KEY: ${AI_INTERNAL_KEY}
      OCR_PROVIDER: ${OCR_PROVIDER:-tesseract}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

volumes:
  medfold_pgdata:
